name: Refresh Release Notes

on:
  schedule:
    # 3:45 PM EST (UTC-5) = 20:45 UTC  |  runs Mon–Fri
    # Note: shifts to 4:45 PM during EDT (Mar–Nov) — acceptable window
    - cron: '45 20 * * 1-5'
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: write  # needed to push the updated index.html

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run refresh script
        shell: pwsh
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: pwsh -NonInteractive -File ./refresh.ps1

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes — content unchanged."
          else
            git commit -m "Auto-refresh: $(date -u '+%Y-%m-%d') release notes update"
            git push
            echo "Pushed updated index.html to GitHub."
          fi
